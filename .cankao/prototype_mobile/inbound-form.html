<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入库记录表单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <div class="bg-white border-b border-gray-200">
        <div class="flex items-center justify-between p-4">
            <button class="p-2 text-gray-600" onclick="goBackToRecord()">
                <i class="fas fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">入库记录</h1>
            <button class="text-blue-500 font-medium">保存</button>
        </div>
    </div>

    <div class="p-4 space-y-6">
        <!-- 快捷选择 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">快捷选择</h3>
            <div class="flex gap-4">
                <button class="flex items-center space-x-3 px-6 py-4 bg-blue-50 border border-blue-200 rounded-xl hover:bg-blue-100 transition-colors whitespace-nowrap">
                    <i class="fas fa-search text-blue-600"></i>
                    <span class="text-blue-600 font-medium">选择物料模板</span>
                </button>
            </div>
        </div>



        
        <!-- 物料信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">物料信息</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">物料名称 *</label>
                    <div class="relative">
                        <input type="text" placeholder="请输入或搜索物料名称" 
                               class="w-full p-3 pr-10 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">物料类型</label>
                        <select class="w-full p-3 border border-gray-200 rounded-xl">
                            <option>茶叶原料</option>
                            <option>包装材料</option>
                            <option>生产工具</option>
                            <option>成品茶叶</option>
                            <option>其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">物料等级</label>
                        <select class="w-full p-3 border border-gray-200 rounded-xl">
                            <option>特级</option>
                            <option>一级</option>
                            <option>二级</option>
                            <option>三级</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">入库数量 *</label>
                        <input type="number" placeholder="0" 
                               class="w-full p-3 border border-gray-200 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">计量单位</label>
                        <select class="w-full p-3 border border-gray-200 rounded-xl">
                            <option>kg</option>
                            <option>g</option>
                            <option>袋</option>
                            <option>盒</option>
                            <option>箱</option>
                            <option>个</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">批次号</label>
                    <input type="text" placeholder="自动生成或手动输入" 
                           class="w-full p-3 border border-gray-200 rounded-xl"readonly>
                </div>
            </div>
        </div>

        <!-- 价格信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">价格信息</h3>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">单价 *</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-500">¥</span>
                            <input type="number" placeholder="0.00" step="0.01"
                                   class="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">总金额</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-500">¥</span>
                            <input type="number" placeholder="0.00" step="0.01" readonly
                                   class="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-500">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 供应商信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">供应商信息</h3>
            <div class="space-y-4">
                <div>
                    <select class="w-full p-3 border border-gray-200 rounded-xl" onchange="showRatingSection(this.value)">
                        <option value="">请选择供应商</option>
                        <option value="安溪茶叶合作社">安溪茶叶合作社</option>
                        <option value="福建包装材料厂">福建包装材料厂</option>
                        <option value="泉州机械设备公司">泉州机械设备公司</option>
                    </select>
                </div>

                <!-- 供应商评价系统 -->
                <div id="supplierRating" class="hidden">
                    <h4 class="text-md font-medium text-gray-800 mb-3">供应商评价</h4>
                    <div class="space-y-3">
                        <!-- 产品质量 -->
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600 w-20">产品质量</span>
                            <div class="flex items-center space-x-1" data-rating="quality">
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="1"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="2"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="3"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="4"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="5"></i>
                                <span class="text-sm text-gray-500 ml-2 rating-text">0分</span>
                            </div>
                        </div>

                        <!-- 交付及时性 -->
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600 w-20">交付及时性</span>
                            <div class="flex items-center space-x-1" data-rating="delivery">
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="1"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="2"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="3"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="4"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="5"></i>
                                <span class="text-sm text-gray-500 ml-2 rating-text">0分</span>
                            </div>
                        </div>

                        <!-- 价格合理性 -->
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600 w-20">价格合理性</span>
                            <div class="flex items-center space-x-1" data-rating="price">
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="1"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="2"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="3"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="4"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="5"></i>
                                <span class="text-sm text-gray-500 ml-2 rating-text">0分</span>
                            </div>
                        </div>

                        <!-- 服务态度 -->
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600 w-20">服务态度</span>
                            <div class="flex items-center space-x-1" data-rating="service">
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="1"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="2"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="3"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="4"></i>
                                <i class="fas fa-star text-gray-300 cursor-pointer star" data-value="5"></i>
                                <span class="text-sm text-gray-500 ml-2 rating-text">0分</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 综合评分 -->
                    <div class="mt-4 p-3 bg-blue-50 rounded-xl">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-blue-800">综合评分</span>
                            <span id="overallRating" class="text-lg font-bold text-blue-600">0.0分</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 其他信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">其他信息</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">入库日期 *</label>
                    <input type="date" value="2024-01-15" 
                           class="w-full p-3 border border-gray-200 rounded-xl">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">存放位置</label>
                    <select class="w-full p-3 border border-gray-200 rounded-xl">
                        <option>仓库A区</option>
                        <option>仓库B区</option>
                        <option>仓库C区</option>
                        <option>展示区</option>
                        <option>冷藏区</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">保质期</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" placeholder="到期日期" 
                               class="w-full p-3 border border-gray-200 rounded-xl">
                        <select class="w-full p-3 border border-gray-200 rounded-xl">
                            <option>24个月</option>
                            <option>18个月</option>
                            <option>12个月</option>
                            <option>6个月</option>
                            <option>3个月</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">备注说明</label>
                    <textarea placeholder="请输入备注信息..." 
                              rows="3" 
                              class="w-full p-3 border border-gray-200 rounded-xl resize-none"></textarea>
                </div>
            </div>
        </div>

        <!-- 质量检验 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">质量检验</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">检验状态</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button class="p-3 bg-green-50 border-2 border-green-500 rounded-xl text-green-600 font-medium">
                            <i class="fas fa-check-circle mr-2"></i>合格
                        </button>
                        <button class="p-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-600 font-medium">
                            <i class="fas fa-exclamation-circle mr-2"></i>待检
                        </button>
                        <button class="p-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-600 font-medium">
                            <i class="fas fa-times-circle mr-2"></i>不合格
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">检验员</label>
                        <input type="text" placeholder="请输入检验员姓名" 
                               class="w-full p-3 border border-gray-200 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">检验日期</label>
                        <input type="date" value="2024-01-15" 
                               class="w-full p-3 border border-gray-200 rounded-xl">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">检验备注</label>
                    <textarea placeholder="请输入检验结果和备注..." 
                              rows="2" 
                              class="w-full p-3 border border-gray-200 rounded-xl resize-none"></textarea>
                </div>
            </div>
        </div>

        <!-- 物料图片 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">物料图片</h3>
            <div class="grid grid-cols-3 gap-3">
                <!-- 上传区域 -->
                <div class="aspect-square border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center bg-gray-50">
                    <i class="fas fa-camera text-2xl text-gray-400 mb-2"></i>
                    <span class="text-sm text-gray-500">添加图片</span>
                </div>
                
                <!-- 示例图片 -->
                <div class="aspect-square bg-green-100 rounded-xl flex items-center justify-center relative">
                    <i class="fas fa-leaf text-3xl text-green-600"></i>
                    <button class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
                
                <div class="aspect-square border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center bg-gray-50">
                    <i class="fas fa-plus text-xl text-gray-400"></i>
                </div>
            </div>
            <div class="mt-3 text-xs text-gray-500">
                最多上传5张图片，支持JPG、PNG格式，单张不超过2MB
            </div>
        </div>

   

        <!-- 操作按钮 -->
        <div class="flex space-x-3 pt-4">
            <button class="flex-1 bg-gray-100 text-gray-700 py-4 rounded-2xl font-semibold hover:bg-gray-200 transition-colors">
                <i class="fas fa-save mr-2"></i>
                保存为模板
            </button>
            <button class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-2xl font-semibold hover:from-blue-600 hover:to-purple-700 transition-all">
                <i class="fas fa-check mr-2"></i>
                确认入库
            </button>
        </div>
    </div>

    <!-- 底部安全区域 -->
    <div class="h-6"></div>

    <script>
        // 返回记录页面
        function goBackToRecord() {
            window.location.href = 'record.html';
        }

        // 自动计算总金额
        function calculateTotal() {
            const quantity = document.querySelector('input[placeholder="0"]').value;
            const unitPrice = document.querySelector('input[placeholder="0.00"]').value;
            
            if (quantity && unitPrice) {
                const total = (quantity * unitPrice).toFixed(2);
                document.querySelectorAll('input[placeholder="0.00"]')[1].value = total;
            }
        }

        // 监听数量和单价输入
        document.querySelector('input[placeholder="0"]').addEventListener('input', calculateTotal);
        document.querySelector('input[placeholder="0.00"]').addEventListener('input', calculateTotal);

        // 供应商评价系统
        const ratings = {
            quality: 0,
            delivery: 0,
            price: 0,
            service: 0
        };

        // 显示供应商评价
        function showRatingSection(supplierValue) {
            const ratingSection = document.getElementById('supplierRating');
            if (ratingSection) {
                if (supplierValue && supplierValue !== '') {
                    ratingSection.classList.remove('hidden');
                } else {
                    ratingSection.classList.add('hidden');
                }
            }
        }

        // 星级评价功能
        function initRatingSystem() {
            document.querySelectorAll('[data-rating]').forEach(ratingGroup => {
                const stars = ratingGroup.querySelectorAll('.star');
                const ratingText = ratingGroup.querySelector('.rating-text');
                const ratingType = ratingGroup.getAttribute('data-rating');

                stars.forEach((star, index) => {
                    // 鼠标悬停效果
                    star.addEventListener('mouseenter', function() {
                        highlightStars(stars, index + 1);
                    });

                    // 点击评分
                    star.addEventListener('click', function() {
                        const rating = index + 1;
                        ratings[ratingType] = rating;
                        setStarRating(stars, rating);
                        ratingText.textContent = rating + '分';
                        updateOverallRating();
                    });
                });

                // 鼠标离开时恢复当前评分
                ratingGroup.addEventListener('mouseleave', function() {
                    setStarRating(stars, ratings[ratingType]);
                });
            });
        }

        // 高亮星星
        function highlightStars(stars, count) {
            stars.forEach((star, index) => {
                if (index < count) {
                    star.className = 'fas fa-star text-yellow-400 cursor-pointer star';
                } else {
                    star.className = 'fas fa-star text-gray-300 cursor-pointer star';
                }
            });
        }

        // 设置星级评分
        function setStarRating(stars, rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.className = 'fas fa-star text-yellow-400 cursor-pointer star';
                } else {
                    star.className = 'fas fa-star text-gray-300 cursor-pointer star';
                }
            });
        }

        // 更新综合评分
        function updateOverallRating() {
            const total = ratings.quality + ratings.delivery + ratings.price + ratings.service;
            const average = total > 0 ? (total / 4).toFixed(1) : '0.0';
            document.getElementById('overallRating').textContent = average + '分';
        }

        // 初始化评价系统
        document.addEventListener('DOMContentLoaded', function() {
            initRatingSystem();
        });

        // 质量检验状态切换
        document.querySelectorAll('.grid-cols-3 button').forEach(button => {
            button.addEventListener('click', function() {
                // 移除所有按钮的选中状态
                document.querySelectorAll('.grid-cols-3 button').forEach(btn => {
                    btn.className = btn.className.replace(/bg-\w+-50 border-\w+-500 text-\w+-600/, 'bg-gray-50 border-gray-200 text-gray-600');
                });
                
                // 设置当前按钮为选中状态
                if (this.textContent.includes('合格')) {
                    this.className = 'p-3 bg-green-50 border-2 border-green-500 rounded-xl text-green-600 font-medium';
                } else if (this.textContent.includes('待检')) {
                    this.className = 'p-3 bg-yellow-50 border-2 border-yellow-500 rounded-xl text-yellow-600 font-medium';
                } else {
                    this.className = 'p-3 bg-red-50 border-2 border-red-500 rounded-xl text-red-600 font-medium';
                }
            });
        });
    </script>
</body>
</html>
