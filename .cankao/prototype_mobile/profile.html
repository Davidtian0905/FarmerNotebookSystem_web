<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .overlay.open {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 左侧导航栏 -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 w-80 h-full bg-white shadow-lg z-50">
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-900">功能菜单</h2>
                <button onclick="toggleSidebar()" class="p-2 text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>

        <div class="p-4 space-y-4">
            <!-- 个人中心 -->
            <div class="bg-gray-50 rounded-xl p-4">
                <div class="flex items-center space-x-3 mb-4">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=48&h=48&fit=crop&crop=face"
                         alt="头像" class="w-12 h-12 rounded-full object-cover">
                    <div>
                        <div class="font-semibold text-gray-900">张茶农</div>
                        <div class="text-sm text-gray-500">138****8888</div>
                    </div>
                </div>
                <button class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg text-sm font-medium hover:bg-blue-600" onclick="window.location.href='profile.html'">
                    个人中心
                </button>
            </div>

            <!-- 出库入库 -->
            <div class="space-y-2">
                <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">库存管理</h3>
                <button class="w-full flex items-center space-x-3 p-3 text-left hover:bg-gray-50 rounded-lg" onclick="window.location.href='inbound-form.html'">
                    <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-arrow-down text-green-600"></i>
                    </div>
                    <span class="font-medium text-gray-900">入库记录</span>
                </button>
                <button class="w-full flex items-center space-x-3 p-3 text-left hover:bg-gray-50 rounded-lg" onclick="window.location.href='outbound-records.html'">
                    <div class="w-8 h-8 bg-red-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-arrow-up text-red-600"></i>
                    </div>
                    <span class="font-medium text-gray-900">出库记录</span>
                </button>
            </div>

            <!-- 数据管理 -->
            <div class="space-y-2">
                <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">数据管理</h3>
                <button class="w-full flex items-center space-x-3 p-3 text-left hover:bg-gray-50 rounded-lg" onclick="window.location.href='import-data.html'">
                    <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-file-import text-blue-600"></i>
                    </div>
                    <span class="font-medium text-gray-900">数据导入</span>
                </button>
                <button class="w-full flex items-center space-x-3 p-3 text-left hover:bg-gray-50 rounded-lg" onclick="window.location.href='export-data.html'">
                    <div class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-file-export text-purple-600"></i>
                    </div>
                    <span class="font-medium text-gray-900">数据导出</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div id="overlay" class="overlay fixed inset-0 bg-black bg-opacity-50 z-40" onclick="toggleSidebar()"></div>

    <!-- 顶部导航栏 -->
    <div class="bg-white border-b border-gray-200">
        <div class="flex items-center justify-between p-4">
            <!-- 左侧菜单按钮 -->
            <button onclick="toggleSidebar()" class="p-2 text-gray-600">
                <i class="fas fa-bars text-xl"></i>
            </button>

            <!-- 中间标题 -->
            <h1 class="text-xl font-bold text-gray-900">个人中心</h1>

            <!-- 右侧功能区 -->
            <div class="flex items-center space-x-3">
                <!-- 搜索按钮 -->
                <button class="p-2 text-gray-600">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 用户头像和菜单 -->
                <div class="relative">
                    <button onclick="toggleUserMenu()" class="flex items-center space-x-2">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=32&h=32&fit=crop&crop=face"
                             alt="头像" class="w-8 h-8 rounded-full object-cover">
                    </button>

                    <!-- 用户菜单下拉 -->
                    <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
                        <div class="py-2">
                            <button class="w-full flex items-center px-4 py-2 text-left hover:bg-gray-50" onclick="window.location.href='settings.html'">
                                <i class="fas fa-cog mr-3 text-gray-400"></i>
                                <span class="text-gray-700">设置</span>
                            </button>
                            <button class="w-full flex items-center px-4 py-2 text-left hover:bg-gray-50 text-red-600">
                                <i class="fas fa-sign-out-alt mr-3 text-red-400"></i>
                                <span>退出登录</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 个人信息卡片 -->
    <div class="p-4">
        <div class="gradient-bg rounded-2xl p-6 text-white card-shadow">
            <div class="flex items-center space-x-4">
                <div class="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=64&h=64&fit=crop&crop=face" 
                         alt="头像" class="w-14 h-14 rounded-full object-cover">
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-bold">张茶农</h2>
                    <p class="text-sm opacity-90">手机号: 138****8888</p>
                    <p class="text-sm opacity-90">茶园: 福建安溪铁观音茶园</p>
                </div>
            </div>
            
            <!-- 统计数据 -->
            <div class="grid grid-cols-3 gap-4 mt-6 pt-6 border-t border-white border-opacity-20">
                <div class="text-center">
                    <div class="text-lg font-bold">156</div>
                    <div class="text-sm opacity-90">记账天数</div>
                </div>
                <div class="text-center">
                    <div class="text-lg font-bold">1,248</div>
                    <div class="text-sm opacity-90">记录笔数</div>
                </div>
                <div class="text-center">
                    <div class="text-lg font-bold">85</div>
                    <div class="text-sm opacity-90">剩余积分</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 功能菜单 -->
    <div class="px-4 space-y-4">
        <!-- 业务管理 -->
        <div class="bg-white rounded-2xl card-shadow">
            <div class="p-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">业务管理</h3>
            </div>
            <div class="divide-y divide-gray-100">
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50" onclick="window.location.href='supplier-management.html'">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-truck text-blue-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">供应商管理</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50" onclick="window.location.href='customer-management.html'">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-users text-green-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">客户管理</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50" onclick="window.location.href='export-data.html'">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-file-export text-purple-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">导出账本数据</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
            </div>
        </div>

        <!-- 积分与会员 -->
        <div class="bg-white rounded-2xl card-shadow">
            <div class="p-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">积分与会员</h3>
            </div>
            <div class="divide-y divide-gray-100">
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50" onclick="window.location.href='points-recharge.html'">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-coins text-yellow-600"></i>
                        </div>
                        <div class="text-left">
                            <div class="font-medium text-gray-900">积分充值</div>
                            <div class="text-sm text-gray-500">当前积分: 85</div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50" onclick="window.location.href='vip-upgrade.html'">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-crown text-orange-600"></i>
                        </div>
                        <div class="text-left">
                            <div class="font-medium text-gray-900">升级VIP</div>
                            <div class="text-sm text-gray-500">解锁更多高级功能</div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
            </div>
        </div>

        <!-- 设置与帮助 -->
        <div class="bg-white rounded-2xl card-shadow">
            <div class="p-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">设置与帮助</h3>
            </div>
            <div class="divide-y divide-gray-100">
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50" onclick="window.location.href='settings.html'">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-user-edit text-gray-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">个人信息</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-shield-alt text-gray-600"></i>
                        </div>
                        <div class="text-left">
                            <div class="font-medium text-gray-900">账户安全中心</div>
                            <div class="text-sm text-red-500">高风险</div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-question-circle text-gray-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">使用帮助</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-comment-alt text-gray-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">意见反馈</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-info-circle text-gray-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">关于我们</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
            </div>
        </div>

        <!-- 退出登录 -->
        <div class="bg-white rounded-2xl card-shadow">
            <button class="w-full flex items-center justify-center p-4 hover:bg-gray-50">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-sign-out-alt text-red-500"></i>
                    <span class="font-medium text-red-500">退出登录</span>
                </div>
            </button>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="flex">
            <div class="flex-1 py-2 text-center">
                <i class="fas fa-chart-bar text-gray-400 text-xl mb-1 block"></i>
                <span class="text-xs text-gray-400">资产</span>
            </div>
            <div class="flex-1 py-2 text-center">
                <i class="fas fa-list text-gray-400 text-xl mb-1 block"></i>
                <span class="text-xs text-gray-400">流水</span>
            </div>
            <div class="flex-1 py-2 text-center">
                <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-1">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
                <span class="text-xs text-gray-400">记录</span>
            </div>
            <div class="flex-1 py-2 text-center">
                <i class="fas fa-boxes text-gray-400 text-xl mb-1 block"></i>
                <span class="text-xs text-gray-400">商品</span>
            </div>
            <div class="flex-1 py-2 text-center">
                <i class="fas fa-user text-blue-500 text-xl mb-1 block"></i>
                <span class="text-xs text-blue-500 font-medium">我的</span>
            </div>
        </div>
    </div>

    <!-- 底部安全区域 -->
    <div class="h-20"></div>

    <script>
        // 侧边栏控制函数
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');

            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // 用户菜单控制函数
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }

        // 点击外部关闭用户菜单
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('userMenu');
            const button = e.target.closest('button');

            if (!button || button.onclick?.toString().indexOf('toggleUserMenu') === -1) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
