<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售记录表单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <div class="bg-white border-b border-gray-200">
        <div class="flex items-center justify-between p-4">
            <button class="p-2 text-gray-600" onclick="goBackToRecord()">
                <i class="fas fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">销售记录</h1>
        </div>
    </div>

    <div class="p-4 space-y-6">
        <!-- 快捷选择 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">快捷选择</h3>
            <div class="flex gap-4">
                <button class="flex items-center space-x-3 px-6 py-4 bg-blue-50 border border-blue-200 rounded-xl hover:bg-blue-100 transition-colors whitespace-nowrap">
                    <i class="fas fa-search text-blue-600"></i>
                    <span class="text-blue-600 font-medium">选择商品模板</span>
                </button>
            </div>
        </div>

    



        <!-- 商品信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">商品信息</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">商品名称 *</label>
                    <div class="relative">
                        <input type="text" placeholder="请输入或搜索商品名称" 
                               class="w-full p-3 pr-10 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 物料组合 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">物料组合</h3>
            
            <!-- 物料组合说明 -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4">
                <div class="flex items-start space-x-2">
                    <i class="fas fa-info-circle text-blue-600 mt-0.5"></i>
                    <div class="text-sm text-blue-800">
                        <p class="font-medium mb-1">物料组合说明：选择构成此商品的各种物料，系统将自动计算成本并扣减库存</p>
                    </div>
                </div>
            </div>

            <!-- 物料列表 -->
            <div class="overflow-x-auto" id="materialsList">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="text-left p-3 border-b border-gray-200 font-medium text-gray-700">物料</th>
                            <th class="text-center p-3 border-b border-gray-200 font-medium text-gray-700">数量</th>
                            <th class="text-center p-3 border-b border-gray-200 font-medium text-gray-700"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="p-3">
                                <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" onchange="updateMaterial(this, 0)">
                                    <option value="成品红茶">成品红茶</option>
                                    <option value="成品绿茶">成品绿茶</option>
                                    <option value="成品白茶">成品白茶</option>
                                    <option value="礼品袋">礼品袋</option>
                                    <option value="罐子">罐子</option>
                                    <option value="包装盒">包装盒</option>
                                </select>
                            </td>
                            <td class="p-3 text-center">
                                <div class="flex items-center justify-center space-x-2">
                                    <input type="number" class="border border-gray-300 rounded-lg px-3 py-2 text-sm w-20 text-center" value="200" min="1" onchange="updateQuantity(this, 0)">
                                    <span class="text-sm text-gray-500" id="unit-0">g</span>
                                </div>
                            </td>
                            <td class="p-3 text-center">
                                <button class="text-red-500 hover:text-red-700 p-1" onclick="removeMaterialItem(0)">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </td>
                        </tr>
                        
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="p-3">
                                <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" onchange="updateMaterial(this, 1)">
                                    <option value="礼品袋">礼品袋</option>
                                    <option value="成品红茶">成品红茶</option>
                                    <option value="成品绿茶">成品绿茶</option>
                                    <option value="成品白茶">成品白茶</option>
                                    <option value="罐子">罐子</option>
                                    <option value="包装盒">包装盒</option>
                                </select>
                            </td>
                            <td class="p-3 text-center">
                                <div class="flex items-center justify-center space-x-2">
                                    <input type="number" class="border border-gray-300 rounded-lg px-3 py-2 text-sm w-20 text-center" value="1" min="1" onchange="updateQuantity(this, 1)">
                                    <span class="text-sm text-gray-500" id="unit-1">个</span>
                                </div>
                            </td>
                            <td class="p-3 text-center">
                                <button class="text-red-500 hover:text-red-700 p-1" onclick="removeMaterialItem(1)">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </td>
                        </tr>
                        
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="p-3">
                                <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" onchange="updateMaterial(this, 2)">
                                    <option value="罐子">罐子</option>
                                    <option value="成品红茶">成品红茶</option>
                                    <option value="成品绿茶">成品绿茶</option>
                                    <option value="成品白茶">成品白茶</option>
                                    <option value="礼品袋">礼品袋</option>
                                    <option value="包装盒">包装盒</option>
                                </select>
                            </td>
                            <td class="p-3 text-center">
                                <div class="flex items-center justify-center space-x-2">
                                    <input type="number" class="border border-gray-300 rounded-lg px-3 py-2 text-sm w-20 text-center" value="2" min="1" onchange="updateQuantity(this, 2)">
                                    <span class="text-sm text-gray-500" id="unit-2">个</span>
                                </div>
                            </td>
                            <td class="p-3 text-center">
                                <button class="text-red-500 hover:text-red-700 p-1" onclick="removeMaterialItem(2)">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 添加物料按钮 -->
            <button class="w-full mt-4 py-3 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-blue-400 hover:text-blue-500 transition-colors" onclick="addMaterialItem()">
                <i class="fas fa-plus mr-2"></i>添加物料
            </button>
            
        </div>





        <!-- 成本汇总 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">成本汇总</h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-600">物料总成本</span>
                    <span class="font-semibold text-gray-900" id="totalMaterialCost">¥0.00</span>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-600">物流成本</span>
                    <div class="relative w-24">
                        <span class="absolute left-3 top-3 text-gray-500">¥</span>
                        <input type="number" placeholder="0.00" step="0.01" id="logisticsCostInput"
                               class="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-xl text-right"
                               oninput="updateCostSummary()">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-600">利润率</span>
                    <div class="relative w-24">
                        <input type="number" placeholder="25" step="0.1" id="profitMarginInput"
                               class="w-full pr-8 pl-4 py-3 border border-gray-300 rounded-xl text-right"
                               oninput="updateCostSummary()">
                        <span class="absolute right-3 top-3 text-gray-500">%</span>
                    </div>
                </div>

                <div class="border-t border-gray-200 pt-2 mt-2">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium text-gray-700">预计售价</span>
                        <span class="font-bold text-blue-600" id="suggestedPrice">¥0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 价格信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">价格定价</h3>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">销售总额</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-500">¥</span>
                            <input type="number" placeholder="0.00" step="0.01" 
                                   class="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">预计利润</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-green-500">¥</span>
                            <input type="number" placeholder="0.00" step="0.01" readonly
                                   class="w-full pl-8 pr-4 py-3 border border-green-300 rounded-xl bg-green-50 text-green-600">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 客户信息 -->
  
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">客户信息</h3>
            <div class="space-y-4">
                <div>
                    <select class="w-full p-3 border border-gray-200 rounded-xl">
                        <option>请选择客户</option>
                        <option>福建茶叶批发商</option>
                        <option>安溪茶业公司</option>
                        <option>泉州茶叶市场</option>
                        <option>厦门茶文化馆</option>
                        <option>漳州茶叶经销商</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">联系人</label>
                        <input type="text" placeholder="自动填充" 
                               class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">联系电话</label>
                        <input type="text" placeholder="自动填充" 
                               class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">地址信息</label>
                        <input type="text" placeholder="自动填充" 
                               class="w-full p-3 border border-gray-200 rounded-xl" readonly>
                    </div>
                </div>
            </div>
        </div>  
   



        <!-- 其他信息 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">其他信息</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">销售渠道</label>
                    <select class="w-full p-3 border border-gray-200 rounded-xl">
                        <option>线下门店</option>
                        <option>微信小程序</option>
                        <option>淘宝店铺</option>
                        <option>拼多多</option>
                        <option>抖音直播</option>
                        <option>朋友圈</option>
                        <option>其他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">备注说明</label>
                    <textarea placeholder="请输入备注信息..." 
                              class="w-full p-3 border border-gray-200 rounded-xl h-24 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">订单标签</label>
                    <div class="flex flex-wrap gap-2">
                        <button class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm">紧急订单</button>
                        <button class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm">VIP客户</button>
                        <button class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm">老客户</button>
                        <button class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">批发订单</button>
                        <button class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm">预定订单</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品图片 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">商品图片</h3>
            <div class="grid grid-cols-3 gap-3">
                <!-- 上传区域 -->
                <div class="aspect-square border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center bg-gray-50">
                    <i class="fas fa-camera text-2xl text-gray-400 mb-2"></i>
                    <span class="text-sm text-gray-500">添加图片</span>
                </div>
                
                <!-- 示例图片 -->
                <div class="aspect-square bg-green-100 rounded-xl flex items-center justify-center relative">
                    <i class="fas fa-leaf text-3xl text-green-600"></i>
                    <button class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
                
                <div class="aspect-square border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center bg-gray-50">
                    <i class="fas fa-plus text-xl text-gray-400"></i>
                </div>
            </div>
            <div class="mt-3 text-xs text-gray-500">
                最多上传5张图片，支持JPG、PNG格式，单张不超过2MB
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex space-x-3 pt-4">
            <button class="flex-1 bg-gray-100 text-gray-700 py-4 rounded-2xl font-semibold hover:bg-gray-200 transition-colors">
                <i class="fas fa-save mr-2"></i>
                保存为模板
            </button>
            <button class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-2xl font-semibold hover:from-blue-600 hover:to-purple-700 transition-all">
                <i class="fas fa-check mr-2"></i>
                确认销售
            </button>
        </div>
    </div>

    <script>
        // 物料数据管理
        let materialItems = [
            { name: '成品红茶', quantity: 200, unit: 'g', unitPrice: 0.1, cost: 20.00 },
            { name: '礼品袋', quantity: 1, unit: '个', unitPrice: 2.5, cost: 2.50 },
            { name: '罐子', quantity: 2, unit: '个', unitPrice: 7.5, cost: 15.00 }
        ];

        // 渲染物料列表
        function renderMaterialsList() {
            const tbody = document.querySelector('#materialsList tbody');
            if (!tbody) return;

            tbody.innerHTML = materialItems.map((item, index) => `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="p-3">
                        <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" onchange="updateMaterial(this, ${index})">
                            <option value="成品红茶" ${item.name === '成品红茶' ? 'selected' : ''}>成品红茶</option>
                            <option value="成品绿茶" ${item.name === '成品绿茶' ? 'selected' : ''}>成品绿茶</option>
                            <option value="成品白茶" ${item.name === '成品白茶' ? 'selected' : ''}>成品白茶</option>
                            <option value="礼品袋" ${item.name === '礼品袋' ? 'selected' : ''}>礼品袋</option>
                            <option value="罐子" ${item.name === '罐子' ? 'selected' : ''}>罐子</option>
                            <option value="包装盒" ${item.name === '包装盒' ? 'selected' : ''}>包装盒</option>
                        </select>
                    </td>
                    <td class="p-3 text-center">
                        <div class="flex items-center justify-center space-x-2">
                            <input type="number" class="border border-gray-300 rounded-lg px-3 py-2 text-sm w-20 text-center" value="${item.quantity}" min="1" onchange="updateQuantity(this, ${index})">
                            <span class="text-sm text-gray-500" id="unit-${index}">${item.unit}</span>
                        </div>
                    </td>
                    <td class="p-3 text-center">
                        <button class="text-red-500 hover:text-red-700 p-1" onclick="removeMaterialItem(${index})">
                            <i class="fas fa-trash text-sm"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            updateMaterialCost();
        }

        // 更新物料名称
        function updateMaterial(selectElement, index) {
            const materialName = selectElement.value;
            if (materialItems[index]) {
                materialItems[index].name = materialName;
                
                // 根据物料类型更新单位和单价
                const materialData = {
                    '成品红茶': { unit: 'g', unitPrice: 0.1 },
                    '成品绿茶': { unit: 'g', unitPrice: 0.12 },
                    '成品白茶': { unit: 'g', unitPrice: 0.15 },
                    '礼品袋': { unit: '个', unitPrice: 2.5 },
                    '罐子': { unit: '个', unitPrice: 7.5 },
                    '包装盒': { unit: '个', unitPrice: 8.0 }
                };
                
                const data = materialData[materialName] || { unit: '个', unitPrice: 1.0 };
                materialItems[index].unit = data.unit;
                materialItems[index].unitPrice = data.unitPrice;
                materialItems[index].cost = materialItems[index].quantity * data.unitPrice;
                
                // 更新显示
                document.getElementById(`unit-${index}`).textContent = data.unit;
                document.getElementById(`cost-${index}`).textContent = `¥${materialItems[index].cost.toFixed(2)}`;
                updateMaterialCost();
            }
        }

        // 更新数量
        function updateQuantity(inputElement, index) {
            const quantity = parseFloat(inputElement.value) || 0;
            if (materialItems[index]) {
                materialItems[index].quantity = quantity;
                materialItems[index].cost = quantity * materialItems[index].unitPrice;
                
                // 更新成本显示
                document.getElementById(`cost-${index}`).textContent = `¥${materialItems[index].cost.toFixed(2)}`;
                updateMaterialCost();
            }
        }

        // 删除物料项
        function removeMaterialItem(index) {
            materialItems.splice(index, 1);
            renderMaterialsList();
        }

        // 添加物料项
        function addMaterialItem() {
            materialItems.push({
                name: '成品红茶',
                quantity: 1,
                unit: 'g',
                unitPrice: 0.1,
                cost: 0.1
            });
            renderMaterialsList();
        }

        // 更新物料成本汇总
        function updateMaterialCost() {
            const totalCost = materialItems.reduce((sum, item) => sum + item.cost, 0);
            const totalCostElement = document.getElementById('totalMaterialCost');
            if (totalCostElement) totalCostElement.textContent = `¥${totalCost.toFixed(2)}`;
            
            // 更新成本汇总
            updateCostSummary();
        }

        // 更新成本汇总（新增函数）
        function updateCostSummary() {
            // 获取物料总成本
            const materialTotalCost = materialItems.reduce((sum, item) => sum + item.cost, 0);
            
            // 获取物流成本
            const logisticsCost = parseFloat(document.getElementById('logisticsCostInput')?.value) || 0;
            
            // 获取利润率
            const profitMargin = parseFloat(document.getElementById('profitMarginInput')?.value) || 0;
            
            // 计算总成本（物料成本 + 物流成本）
            const totalCost = materialTotalCost + logisticsCost;
            
            // 计算预计售价（总成本 * (1 + 利润率/100)）
            const suggestedPrice = totalCost * (1 + profitMargin / 100);
            
            // 更新显示
            const suggestedPriceElement = document.getElementById('suggestedPrice');
            if (suggestedPriceElement) {
                suggestedPriceElement.textContent = `¥${suggestedPrice.toFixed(2)}`;
            }
            
            // 同时更新价格定价部分的销售总额（如果存在）
            const salesAmountInputs = document.querySelectorAll('input[placeholder="0.00"]');
            if (salesAmountInputs.length > 0) {
                salesAmountInputs[0].value = suggestedPrice.toFixed(2);
            }
            
            // 计算预计利润
            const estimatedProfit = suggestedPrice - totalCost;
            if (salesAmountInputs.length > 1) {
                salesAmountInputs[1].value = estimatedProfit.toFixed(2);
            }
        }

        // 显示物料模板选择
        function showMaterialTemplates() {
            alert('选择模板功能开发中...');
        }

        // 更新物流成本
        function updateLogisticsCost() {
            const logisticsProvider = document.getElementById('logisticsProvider');
            const shippingCostInput = document.getElementById('shippingCost');
            
            if (!logisticsProvider || !shippingCostInput) return;
            
            const selectedOption = logisticsProvider.options[logisticsProvider.selectedIndex];
            const cost = selectedOption.getAttribute('data-cost');
            
            if (cost && selectedOption.value !== '自定义') {
                shippingCostInput.value = cost;
                shippingCostInput.readOnly = true;
                shippingCostInput.classList.add('bg-gray-100');
            } else if (selectedOption.value === '自定义') {
                shippingCostInput.value = '';
                shippingCostInput.readOnly = false;
                shippingCostInput.classList.remove('bg-gray-100');
                shippingCostInput.focus();
            } else {
                shippingCostInput.value = '';
                shippingCostInput.readOnly = false;
                shippingCostInput.classList.remove('bg-gray-100');
            }
            
            // 重新计算总成本
            calculateTotals();
        }

        // 保存为模板
        function saveAsTemplate() {
            if (materialItems.length === 0) {
                alert('请先添加物料再保存模板');
                return;
            }
            alert('保存模板功能开发中...');
        }

        // 返回记录页面
        function goBackToRecord() {
            window.location.href = 'record.html';
        }

        // 自动计算销售总额和预计利润
        function calculateTotals() {
            const quantity = parseFloat(document.getElementById('quantity')?.value) || 0;
            const salePrice = parseFloat(document.getElementById('salePrice')?.value) || 0;
            const costPrice = parseFloat(document.getElementById('costPrice')?.value) || 0;
            const shippingCost = parseFloat(document.getElementById('shippingCost')?.value) || 0;
            
            // 计算物料总成本
            const materialTotalCost = materialItems.reduce((sum, item) => sum + item.cost, 0);
            
            // 计算总成本（物料成本 + 物流成本）
            const totalCost = materialTotalCost + shippingCost;
            
            // 计算销售总额
            const totalAmount = quantity * salePrice;
            
            // 计算总利润（销售总额 - 总成本）
            const totalProfit = totalAmount - totalCost;
            
            // 计算利润率
            const profitMargin = totalAmount > 0 ? (totalProfit / totalAmount * 100) : 0;
            
            // 更新显示
            if (document.getElementById('totalAmount')) {
                document.getElementById('totalAmount').value = totalAmount.toFixed(2);
            }
            if (document.getElementById('totalProfit')) {
                document.getElementById('totalProfit').value = totalProfit.toFixed(2);
            }
            
            // 更新物料成本汇总区域
            updateMaterialCost();
            
            // 显示成本分析
            console.log('成本分析:', {
                物料成本: materialTotalCost.toFixed(2),
                物流成本: shippingCost.toFixed(2),
                总成本: totalCost.toFixed(2),
                销售总额: totalAmount.toFixed(2),
                总利润: totalProfit.toFixed(2),
                利润率: profitMargin.toFixed(2) + '%'
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 渲染物料列表
            renderMaterialsList();

            // 设置默认值
            const logisticsCostInput = document.getElementById('logisticsCostInput');
            const profitMarginInput = document.getElementById('profitMarginInput');
            
            if (logisticsCostInput) {
                logisticsCostInput.value = '0.00';
            }
            if (profitMarginInput) {
                profitMarginInput.value = '25';
            }

            // 绑定计算事件监听器
            const quantityInput = document.getElementById('quantity');
            const salePriceInput = document.getElementById('salePrice');
            const costPriceInput = document.getElementById('costPrice');
            const shippingCostInput = document.getElementById('shippingCost');
            
            if (quantityInput) quantityInput.addEventListener('input', calculateTotals);
            if (salePriceInput) salePriceInput.addEventListener('input', calculateTotals);
            if (costPriceInput) costPriceInput.addEventListener('input', calculateTotals);
            if (shippingCostInput) shippingCostInput.addEventListener('input', calculateTotals);
            
            // 设置预计送达时间默认值（3天后）
            const estimatedDeliveryInput = document.getElementById('estimatedDelivery');
            if (estimatedDeliveryInput) {
                const today = new Date();
                const threeDaysLater = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
                const formattedDate = threeDaysLater.toISOString().split('T')[0];
                estimatedDeliveryInput.value = formattedDate;
            }
            
            // 初始化成本汇总计算
            updateCostSummary();
        });
    </script>

    <!-- 底部安全区域 -->
    <div class="h-6"></div>
</body>
</html>
