<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI语音记账</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .wave-animation {
            animation: wave 1.5s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 40px; }
        }
        .recording-indicator {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }
        .listening-indicator {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        .processing-indicator {
            background: linear-gradient(45deg, #feca57, #ff9ff3);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <div class="bg-white border-b border-gray-200">
        <div class="flex items-center justify-between p-4">
            <button class="p-2 text-gray-600" onclick="goBack()">
                <i class="fas fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">AI语音记账</h1>
            <button class="text-blue-500 font-medium" onclick="showHistory()">
                <i class="fas fa-history"></i>
            </button>
        </div>
    </div>

    <div class="p-4 space-y-6">
        <!-- 积分余额 -->
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl p-4 text-white card-shadow">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-sm opacity-90">当前积分余额</div>
                    <div class="text-2xl font-bold">128 积分</div>
                </div>
                <div class="text-right">
                    <div class="text-sm opacity-90">本次消耗</div>
                    <div class="text-lg font-semibold">1 积分</div>
                </div>
            </div>
        </div>

        <!-- 语音状态指示器 -->
        <div class="bg-white rounded-2xl p-6 card-shadow text-center" id="voiceStatus">
            <div class="mb-6">
                <div class="w-32 h-32 mx-auto rounded-full flex items-center justify-center mb-4 recording-indicator" id="statusIndicator">
                    <i class="fas fa-microphone text-white text-4xl" id="statusIcon"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-900 mb-2" id="statusTitle">准备开始录音</h3>
                <p class="text-gray-600" id="statusDescription">点击下方按钮开始语音记账</p>
            </div>

            <!-- 音波动画 -->
            <div class="flex justify-center items-end space-x-1 mb-6 h-12" id="waveAnimation" style="display: none;">
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0s;"></div>
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0.1s;"></div>
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0.2s;"></div>
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0.3s;"></div>
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0.4s;"></div>
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0.5s;"></div>
                <div class="w-2 bg-blue-500 rounded-full wave-animation" style="animation-delay: 0.6s;"></div>
            </div>

            <!-- 录音控制按钮 -->
            <div class="flex justify-center space-x-4">
                <button class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-white hover:bg-red-600 transition-colors pulse-animation" 
                        id="recordButton" onclick="toggleRecording()">
                    <i class="fas fa-microphone text-2xl"></i>
                </button>
                <button class="w-16 h-16 bg-gray-300 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-400 transition-colors" 
                        id="stopButton" onclick="stopRecording()" style="display: none;">
                    <i class="fas fa-stop text-2xl"></i>
                </button>
            </div>
        </div>

        <!-- 语音识别结果 -->
        <div class="bg-white rounded-2xl p-4 card-shadow" id="recognitionResult" style="display: none;">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">识别结果</h3>
            <div class="bg-gray-50 rounded-xl p-4 mb-4">
                <p class="text-gray-700" id="recognizedText">正在识别中...</p>
            </div>
            <div class="flex space-x-3">
                <button class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-200 transition-colors" onclick="retryRecording()">
                    <i class="fas fa-redo mr-2"></i>
                    重新录音
                </button>
                <button class="flex-1 bg-blue-500 text-white py-3 rounded-xl font-medium hover:bg-blue-600 transition-colors" onclick="confirmResult()">
                    <i class="fas fa-check mr-2"></i>
                    确认记录
                </button>
            </div>
        </div>

        <!-- AI解析结果 -->
        <div class="bg-white rounded-2xl p-4 card-shadow" id="aiAnalysis" style="display: none;">
            <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                <i class="fas fa-robot text-blue-600 mr-2"></i>
                AI智能解析
            </h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-50 rounded-xl p-3">
                        <div class="text-sm text-blue-600 font-medium">记录类型</div>
                        <div class="text-lg font-semibold text-blue-900" id="recordType">销售记录</div>
                    </div>
                    <div class="bg-green-50 rounded-xl p-3">
                        <div class="text-sm text-green-600 font-medium">金额</div>
                        <div class="text-lg font-semibold text-green-900" id="amount">¥1,200.00</div>
                    </div>
                </div>
                
                <div class="bg-gray-50 rounded-xl p-4">
                    <div class="text-sm text-gray-600 font-medium mb-2">解析详情</div>
                    <div class="space-y-2" id="analysisDetails">
                        <div class="flex justify-between">
                            <span class="text-gray-700">商品名称:</span>
                            <span class="font-medium">红茶礼盒</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-700">数量:</span>
                            <span class="font-medium">10盒</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-700">单价:</span>
                            <span class="font-medium">¥120.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-700">客户:</span>
                            <span class="font-medium">张先生</span>
                        </div>
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-200 transition-colors" onclick="editRecord()">
                        <i class="fas fa-edit mr-2"></i>
                        编辑记录
                    </button>
                    <button class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-xl font-medium hover:from-blue-600 hover:to-purple-700 transition-all" onclick="saveRecord()">
                        <i class="fas fa-save mr-2"></i>
                        保存记录
                    </button>
                </div>
            </div>
        </div>

        <!-- 使用提示 -->
        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl p-4 border border-yellow-200">
            <h3 class="text-lg font-semibold text-gray-900 mb-3 flex items-center">
                <i class="fas fa-lightbulb text-yellow-600 mr-2"></i>
                使用提示
            </h3>
            <div class="space-y-2 text-sm text-gray-700">
                <div class="flex items-start space-x-2">
                    <i class="fas fa-check-circle text-green-500 mt-0.5"></i>
                    <span>说话清晰，语速适中，避免方言</span>
                </div>
                <div class="flex items-start space-x-2">
                    <i class="fas fa-check-circle text-green-500 mt-0.5"></i>
                    <span>包含完整信息：商品、数量、价格、客户</span>
                </div>
                <div class="flex items-start space-x-2">
                    <i class="fas fa-check-circle text-green-500 mt-0.5"></i>
                    <span>示例："今天卖给张先生10盒红茶，每盒120元"</span>
                </div>
            </div>
        </div>

        <!-- 快捷模板 -->
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">快捷模板</h3>
            <div class="grid grid-cols-1 gap-3">
                <button class="text-left p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors" onclick="useTemplate('sales')">
                    <div class="font-medium text-gray-900">销售记录模板</div>
                    <div class="text-sm text-gray-500">"今天卖给[客户][商品][数量][单价]"</div>
                </button>
                <button class="text-left p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors" onclick="useTemplate('purchase')">
                    <div class="font-medium text-gray-900">采购记录模板</div>
                    <div class="text-sm text-gray-500">"从[供应商]采购[商品][数量][单价]"</div>
                </button>
                <button class="text-left p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors" onclick="useTemplate('expense')">
                    <div class="font-medium text-gray-900">支出记录模板</div>
                    <div class="text-sm text-gray-500">"今天支出[金额]用于[用途]"</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recordingTimer = null;
        let recordingTime = 0;

        // 返回上一页
        function goBack() {
            window.location.href = 'record.html';
        }

        // 显示历史记录
        function showHistory() {
            alert('历史记录功能开发中...');
        }

        // 切换录音状态
        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        // 开始录音
        function startRecording() {
            isRecording = true;
            recordingTime = 0;
            
            // 更新UI状态
            updateStatus('recording', '正在录音...', '请清晰地说出您要记录的内容');
            document.getElementById('recordButton').style.display = 'none';
            document.getElementById('stopButton').style.display = 'flex';
            document.getElementById('waveAnimation').style.display = 'flex';
            document.getElementById('recognitionResult').style.display = 'none';
            document.getElementById('aiAnalysis').style.display = 'none';
            
            // 模拟录音计时
            recordingTimer = setInterval(() => {
                recordingTime++;
                document.getElementById('statusDescription').textContent = `录音中... ${recordingTime}秒`;
            }, 1000);
            
            // 模拟录音过程（实际项目中这里会调用语音识别API）
            setTimeout(() => {
                if (isRecording) {
                    stopRecording();
                }
            }, 5000); // 5秒后自动停止
        }

        // 停止录音
        function stopRecording() {
            isRecording = false;
            clearInterval(recordingTimer);
            
            // 更新UI状态
            updateStatus('processing', '正在处理...', 'AI正在分析您的语音内容');
            document.getElementById('stopButton').style.display = 'none';
            document.getElementById('waveAnimation').style.display = 'none';
            
            // 模拟处理过程
            setTimeout(() => {
                showRecognitionResult();
            }, 2000);
        }

        // 显示识别结果
        function showRecognitionResult() {
            updateStatus('completed', '识别完成', '请确认识别结果是否正确');
            document.getElementById('recognitionResult').style.display = 'block';
            document.getElementById('recognizedText').textContent = '今天卖给张先生10盒红茶礼盒，每盒120元，总共1200元';
            document.getElementById('recordButton').style.display = 'flex';
            
            // 显示AI解析结果
            setTimeout(() => {
                document.getElementById('aiAnalysis').style.display = 'block';
            }, 1000);
        }

        // 重新录音
        function retryRecording() {
            document.getElementById('recognitionResult').style.display = 'none';
            document.getElementById('aiAnalysis').style.display = 'none';
            updateStatus('ready', '准备开始录音', '点击下方按钮开始语音记账');
        }

        // 确认结果
        function confirmResult() {
            document.getElementById('aiAnalysis').style.display = 'block';
        }

        // 编辑记录
        function editRecord() {
            // 跳转到编辑页面
            window.location.href = 'sales-form.html';
        }

        // 保存记录
        function saveRecord() {
            alert('记录保存成功！消耗1积分');
            window.location.href = 'record.html';
        }

        // 使用模板
        function useTemplate(type) {
            let template = '';
            switch(type) {
                case 'sales':
                    template = '请按照"今天卖给[客户][商品][数量][单价]"的格式说话';
                    break;
                case 'purchase':
                    template = '请按照"从[供应商]采购[商品][数量][单价]"的格式说话';
                    break;
                case 'expense':
                    template = '请按照"今天支出[金额]用于[用途]"的格式说话';
                    break;
            }
            alert(template);
        }

        // 更新状态显示
        function updateStatus(status, title, description) {
            const indicator = document.getElementById('statusIndicator');
            const icon = document.getElementById('statusIcon');
            const titleEl = document.getElementById('statusTitle');
            const descEl = document.getElementById('statusDescription');
            
            // 移除所有状态类
            indicator.className = 'w-32 h-32 mx-auto rounded-full flex items-center justify-center mb-4';
            
            switch(status) {
                case 'ready':
                    indicator.classList.add('recording-indicator');
                    icon.className = 'fas fa-microphone text-white text-4xl';
                    break;
                case 'recording':
                    indicator.classList.add('recording-indicator', 'pulse-animation');
                    icon.className = 'fas fa-microphone text-white text-4xl';
                    break;
                case 'processing':
                    indicator.classList.add('processing-indicator', 'pulse-animation');
                    icon.className = 'fas fa-cog fa-spin text-white text-4xl';
                    break;
                case 'completed':
                    indicator.classList.add('listening-indicator');
                    icon.className = 'fas fa-check text-white text-4xl';
                    break;
            }
            
            titleEl.textContent = title;
            descEl.textContent = description;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('ready', '准备开始录音', '点击下方按钮开始语音记账');
        });
    </script>

    <!-- 底部安全区域 -->
    <div class="h-6"></div>
</body>
</html>
