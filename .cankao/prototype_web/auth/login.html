<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 茶农手账系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/css/custom.css">
    <style>
        .login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        
        .login-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover;
            opacity: 0.1;
        }
        
        .tea-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: float 20s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .form-input:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        
        .social-btn {
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            border-color: #10B981;
            background: #f0fdf4;
        }
        
        .tea-leaf {
            color: #10B981;
            animation: rotate 3s ease-in-out infinite;
        }
        
        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
    <div class="tea-pattern"></div>
    
    <div class="login-card rounded-2xl shadow-2xl p-8 w-full max-w-md relative z-10">
        <!-- Logo和标题 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-full mb-4">
                <i class="fas fa-leaf text-white text-2xl tea-leaf"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">茶农手账系统</h1>
            <p class="text-gray-600">欢迎回来，请登录您的账户</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="space-y-6">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user mr-2 text-gray-400"></i>
                    用户名/手机号
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input"
                    placeholder="请输入用户名或手机号"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock mr-2 text-gray-400"></i>
                    密码
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input pr-12"
                        placeholder="请输入密码"
                        required
                    >
                    <button 
                        type="button" 
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                        onclick="togglePassword()"
                    >
                        <i id="passwordIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                    <span class="ml-2 text-sm text-gray-600">记住我</span>
                </label>
                <a href="forgot-password.html" class="text-sm text-green-600 hover:text-green-500">
                    忘记密码？
                </a>
            </div>

            <button 
                type="submit" 
                class="btn-login w-full py-3 px-4 text-white font-medium rounded-lg"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>
                登录
            </button>
        </form>

        <!-- 分割线 -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-500">或者</span>
            </div>
        </div>

        <!-- 第三方登录 -->
        <div class="space-y-3">
            <button class="social-btn w-full py-3 px-4 rounded-lg flex items-center justify-center">
                <i class="fab fa-wechat text-green-500 text-xl mr-3"></i>
                <span class="text-gray-700">微信登录</span>
            </button>
            
            <button class="social-btn w-full py-3 px-4 rounded-lg flex items-center justify-center">
                <i class="fas fa-mobile-alt text-blue-500 text-xl mr-3"></i>
                <span class="text-gray-700">短信验证码登录</span>
            </button>
        </div>

        <!-- 注册链接 -->
        <div class="text-center mt-6">
            <span class="text-gray-600">还没有账户？</span>
            <a href="register.html" class="text-green-600 hover:text-green-500 font-medium ml-1">
                立即注册
            </a>
        </div>

        <!-- 版本信息 -->
        <div class="text-center mt-8 pt-6 border-t border-gray-200">
            <p class="text-xs text-gray-500">
                茶农手账系统 Web版 v1.0.0
            </p>
        </div>
    </div>

    <script src="../shared/js/main.js"></script>
    <script>
        // 切换密码显示/隐藏
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                Message.error('请填写完整的登录信息');
                return;
            }
            
            // 显示加载状态
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
            submitBtn.disabled = true;
            
            // 模拟登录请求
            setTimeout(() => {
                // 模拟登录成功
                if (username === 'admin' && password === '123456') {
                    Message.success('登录成功！');
                    setTimeout(() => {
                        window.location.href = '../dashboard/dashboard.html';
                    }, 1000);
                } else {
                    Message.error('用户名或密码错误');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            }, 2000);
        });

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.querySelector('.login-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });

        // 输入框焦点效果
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
    </script>
</body>
</html>
