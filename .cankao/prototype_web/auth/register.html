<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 茶农手账系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/css/custom.css">
    <style>
        .register-bg {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            position: relative;
            overflow: hidden;
        }
        
        .register-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1597318181409-cf64e4940c4b?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover;
            opacity: 0.1;
        }
        
        .register-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .step {
            display: flex;
            align-items: center;
            margin: 0 1rem;
        }
        
        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .step.active .step-number {
            background: #10B981;
            color: white;
        }
        
        .step.completed .step-number {
            background: #059669;
            color: white;
        }
        
        .step:not(.active):not(.completed) .step-number {
            background: #e5e7eb;
            color: #6b7280;
        }
        
        .step-line {
            width: 60px;
            height: 2px;
            background: #e5e7eb;
            margin: 0 1rem;
        }
        
        .step.completed + .step-line {
            background: #10B981;
        }
        
        .form-step {
            display: none;
        }
        
        .form-step.active {
            display: block;
        }
        
        .strength-meter {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak { background: #ef4444; width: 25%; }
        .strength-fair { background: #f59e0b; width: 50%; }
        .strength-good { background: #10b981; width: 75%; }
        .strength-strong { background: #059669; width: 100%; }
    </style>
</head>
<body class="register-bg min-h-screen flex items-center justify-center p-4">
    <div class="register-card rounded-2xl shadow-2xl p-8 w-full max-w-lg relative z-10">
        <!-- Logo和标题 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-full mb-4">
                <i class="fas fa-leaf text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">创建账户</h1>
            <p class="text-gray-600">加入茶农手账系统，开启数字化管理</p>
        </div>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step active" data-step="1">
                <div class="step-number">1</div>
                <span class="text-sm">基本信息</span>
            </div>
            <div class="step-line"></div>
            <div class="step" data-step="2">
                <div class="step-number">2</div>
                <span class="text-sm">验证手机</span>
            </div>
            <div class="step-line"></div>
            <div class="step" data-step="3">
                <div class="step-number">3</div>
                <span class="text-sm">完成注册</span>
            </div>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm">
            <!-- 第一步：基本信息 -->
            <div class="form-step active" data-step="1">
                <div class="space-y-4">
                    <div class="form-group">
                        <label for="username" class="form-label">
                            <i class="fas fa-user mr-2 text-gray-400"></i>
                            用户名
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input"
                            placeholder="请输入用户名（3-20个字符）"
                            required
                        >
                        <div class="text-xs text-gray-500 mt-1">用户名将作为您的登录凭证</div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope mr-2 text-gray-400"></i>
                            邮箱地址
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input"
                            placeholder="请输入邮箱地址"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock mr-2 text-gray-400"></i>
                            密码
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input pr-12"
                                placeholder="请输入密码（至少8位）"
                                required
                                oninput="checkPasswordStrength(this.value)"
                            >
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                onclick="togglePassword('password')"
                            >
                                <i id="passwordIcon" class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="strength-meter">
                            <div id="strengthFill" class="strength-fill"></div>
                        </div>
                        <div id="strengthText" class="text-xs text-gray-500 mt-1">密码强度：请输入密码</div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">
                            <i class="fas fa-lock mr-2 text-gray-400"></i>
                            确认密码
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                class="form-input pr-12"
                                placeholder="请再次输入密码"
                                required
                            >
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                onclick="togglePassword('confirmPassword')"
                            >
                                <i id="confirmPasswordIcon" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between mt-6">
                    <a href="login.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left mr-2"></i>
                        返回登录
                    </a>
                    <button type="button" class="btn btn-primary" onclick="nextStep(1)">
                        下一步
                        <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- 第二步：验证手机 -->
            <div class="form-step" data-step="2">
                <div class="space-y-4">
                    <div class="form-group">
                        <label for="phone" class="form-label">
                            <i class="fas fa-mobile-alt mr-2 text-gray-400"></i>
                            手机号码
                        </label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="form-input"
                            placeholder="请输入手机号码"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="smsCode" class="form-label">
                            <i class="fas fa-shield-alt mr-2 text-gray-400"></i>
                            短信验证码
                        </label>
                        <div class="flex space-x-3">
                            <input 
                                type="text" 
                                id="smsCode" 
                                name="smsCode" 
                                class="form-input flex-1"
                                placeholder="请输入验证码"
                                required
                            >
                            <button 
                                type="button" 
                                id="sendSmsBtn"
                                class="btn btn-secondary whitespace-nowrap"
                                onclick="sendSmsCode()"
                            >
                                发送验证码
                            </button>
                        </div>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <div class="flex items-start">
                            <i class="fas fa-info-circle text-blue-500 mt-1 mr-3"></i>
                            <div class="text-sm text-blue-700">
                                <p class="font-medium mb-1">验证码已发送</p>
                                <p>请查收短信验证码，如未收到请检查手机号是否正确或重新发送</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between mt-6">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(2)">
                        <i class="fas fa-arrow-left mr-2"></i>
                        上一步
                    </button>
                    <button type="button" class="btn btn-primary" onclick="nextStep(2)">
                        验证并继续
                        <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- 第三步：完成注册 -->
            <div class="form-step" data-step="3">
                <div class="text-center space-y-4">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-4">
                        <i class="fas fa-check text-green-600 text-3xl"></i>
                    </div>
                    
                    <h3 class="text-xl font-semibold text-gray-900">注册成功！</h3>
                    <p class="text-gray-600">欢迎加入茶农手账系统</p>
                    
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-left">
                        <h4 class="font-medium text-green-800 mb-2">您已获得新用户福利：</h4>
                        <ul class="text-sm text-green-700 space-y-1">
                            <li><i class="fas fa-gift mr-2"></i>免费试用VIP功能30天</li>
                            <li><i class="fas fa-coins mr-2"></i>赠送100积分用于AI功能</li>
                            <li><i class="fas fa-book mr-2"></i>免费获得茶叶管理指南</li>
                        </ul>
                    </div>
                </div>

                <div class="flex justify-center mt-6">
                    <button type="button" class="btn btn-primary px-8" onclick="completeRegistration()">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        立即登录
                    </button>
                </div>
            </div>
        </form>

        <!-- 用户协议 -->
        <div class="text-center mt-6 pt-6 border-t border-gray-200">
            <p class="text-xs text-gray-500">
                注册即表示您同意我们的
                <a href="#" class="text-green-600 hover:text-green-500">用户协议</a>
                和
                <a href="#" class="text-green-600 hover:text-green-500">隐私政策</a>
            </p>
        </div>
    </div>

    <script src="../shared/js/main.js"></script>
    <script>
        let currentStep = 1;
        let smsCountdown = 0;

        // 切换密码显示/隐藏
        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const passwordIcon = document.getElementById(inputId + 'Icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }

        // 检查密码强度
        function checkPasswordStrength(password) {
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            let strengthLabel = '';
            
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            strengthFill.className = 'strength-fill';
            
            if (strength <= 1) {
                strengthFill.classList.add('strength-weak');
                strengthLabel = '弱';
            } else if (strength <= 2) {
                strengthFill.classList.add('strength-fair');
                strengthLabel = '一般';
            } else if (strength <= 3) {
                strengthFill.classList.add('strength-good');
                strengthLabel = '良好';
            } else {
                strengthFill.classList.add('strength-strong');
                strengthLabel = '强';
            }
            
            strengthText.textContent = `密码强度：${strengthLabel}`;
        }

        // 下一步
        function nextStep(step) {
            if (validateStep(step)) {
                if (step < 3) {
                    showStep(step + 1);
                }
            }
        }

        // 上一步
        function prevStep(step) {
            if (step > 1) {
                showStep(step - 1);
            }
        }

        // 显示指定步骤
        function showStep(step) {
            // 隐藏所有步骤
            document.querySelectorAll('.form-step').forEach(el => {
                el.classList.remove('active');
            });
            
            // 显示当前步骤
            document.querySelector(`.form-step[data-step="${step}"]`).classList.add('active');
            
            // 更新步骤指示器
            document.querySelectorAll('.step').forEach((el, index) => {
                el.classList.remove('active', 'completed');
                if (index + 1 < step) {
                    el.classList.add('completed');
                } else if (index + 1 === step) {
                    el.classList.add('active');
                }
            });
            
            currentStep = step;
        }

        // 验证步骤
        function validateStep(step) {
            switch (step) {
                case 1:
                    const username = document.getElementById('username').value;
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    
                    if (!username || username.length < 3) {
                        Message.error('用户名至少需要3个字符');
                        return false;
                    }
                    
                    if (!email || !/\S+@\S+\.\S+/.test(email)) {
                        Message.error('请输入有效的邮箱地址');
                        return false;
                    }
                    
                    if (!password || password.length < 8) {
                        Message.error('密码至少需要8个字符');
                        return false;
                    }
                    
                    if (password !== confirmPassword) {
                        Message.error('两次输入的密码不一致');
                        return false;
                    }
                    
                    return true;
                    
                case 2:
                    const phone = document.getElementById('phone').value;
                    const smsCode = document.getElementById('smsCode').value;
                    
                    if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                        Message.error('请输入有效的手机号码');
                        return false;
                    }
                    
                    if (!smsCode || smsCode.length !== 6) {
                        Message.error('请输入6位验证码');
                        return false;
                    }
                    
                    return true;
                    
                default:
                    return true;
            }
        }

        // 发送短信验证码
        function sendSmsCode() {
            const phone = document.getElementById('phone').value;
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                Message.error('请先输入有效的手机号码');
                return;
            }
            
            const sendBtn = document.getElementById('sendSmsBtn');
            smsCountdown = 60;
            
            const updateCountdown = () => {
                if (smsCountdown > 0) {
                    sendBtn.textContent = `${smsCountdown}秒后重发`;
                    sendBtn.disabled = true;
                    smsCountdown--;
                    setTimeout(updateCountdown, 1000);
                } else {
                    sendBtn.textContent = '发送验证码';
                    sendBtn.disabled = false;
                }
            };
            
            updateCountdown();
            Message.success('验证码已发送，请查收短信');
        }

        // 完成注册
        function completeRegistration() {
            Message.success('注册成功，正在跳转到登录页面...');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.querySelector('.register-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
