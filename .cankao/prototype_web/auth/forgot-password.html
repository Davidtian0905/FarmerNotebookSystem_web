<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 茶农手账系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/css/custom.css">
    <style>
        .forgot-bg {
            background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
            position: relative;
            overflow: hidden;
        }
        
        .forgot-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover;
            opacity: 0.1;
        }
        
        .forgot-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .step-container {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success-icon {
            animation: bounceIn 0.6s ease;
        }
        
        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .reset-method {
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .reset-method:hover {
            border-color: #3B82F6;
            background: #eff6ff;
        }
        
        .reset-method.selected {
            border-color: #3B82F6;
            background: #eff6ff;
        }
        
        .reset-method input[type="radio"] {
            display: none;
        }
    </style>
</head>
<body class="forgot-bg min-h-screen flex items-center justify-center p-4">
    <div class="forgot-card rounded-2xl shadow-2xl p-8 w-full max-w-md relative z-10">
        <!-- Logo和标题 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full mb-4">
                <i class="fas fa-key text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">找回密码</h1>
            <p class="text-gray-600">选择找回密码的方式</p>
        </div>

        <div class="step-container">
            <!-- 第一步：选择找回方式 -->
            <div class="step active" id="step1">
                <div class="space-y-4">
                    <div class="reset-method rounded-lg p-4" onclick="selectMethod('email')">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="resetMethod" value="email">
                            <div class="flex items-center w-full">
                                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mr-4">
                                    <i class="fas fa-envelope text-blue-600"></i>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-medium text-gray-900">邮箱找回</h3>
                                    <p class="text-sm text-gray-500">通过注册邮箱接收重置链接</p>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400"></i>
                            </div>
                        </label>
                    </div>

                    <div class="reset-method rounded-lg p-4" onclick="selectMethod('phone')">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="resetMethod" value="phone">
                            <div class="flex items-center w-full">
                                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mr-4">
                                    <i class="fas fa-mobile-alt text-green-600"></i>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-medium text-gray-900">短信找回</h3>
                                    <p class="text-sm text-gray-500">通过手机短信验证码重置</p>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400"></i>
                            </div>
                        </label>
                    </div>

                    <div class="reset-method rounded-lg p-4" onclick="selectMethod('security')">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="resetMethod" value="security">
                            <div class="flex items-center w-full">
                                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mr-4">
                                    <i class="fas fa-shield-alt text-purple-600"></i>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-medium text-gray-900">安全问题</h3>
                                    <p class="text-sm text-gray-500">回答预设的安全问题</p>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400"></i>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="flex justify-between mt-8">
                    <a href="login.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left mr-2"></i>
                        返回登录
                    </a>
                    <button type="button" class="btn btn-primary" onclick="nextStep()" disabled id="nextBtn">
                        下一步
                        <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- 第二步：邮箱找回 -->
            <div class="step" id="step2-email">
                <form id="emailResetForm" class="space-y-6">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-envelope text-blue-600 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900">邮箱验证</h3>
                        <p class="text-gray-600">请输入您的注册邮箱</p>
                    </div>

                    <div class="form-group">
                        <label for="resetEmail" class="form-label">邮箱地址</label>
                        <input 
                            type="email" 
                            id="resetEmail" 
                            name="resetEmail" 
                            class="form-input"
                            placeholder="请输入注册邮箱"
                            required
                        >
                    </div>

                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <div class="flex items-start">
                            <i class="fas fa-info-circle text-blue-500 mt-1 mr-3"></i>
                            <div class="text-sm text-blue-700">
                                <p>我们将向您的邮箱发送密码重置链接，请点击链接完成密码重置。</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between">
                        <button type="button" class="btn btn-secondary" onclick="prevStep()">
                            <i class="fas fa-arrow-left mr-2"></i>
                            上一步
                        </button>
                        <button type="submit" class="btn btn-primary">
                            发送重置链接
                            <i class="fas fa-paper-plane ml-2"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 第二步：短信找回 -->
            <div class="step" id="step2-phone">
                <form id="phoneResetForm" class="space-y-6">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-mobile-alt text-green-600 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900">短信验证</h3>
                        <p class="text-gray-600">请输入您的注册手机号</p>
                    </div>

                    <div class="form-group">
                        <label for="resetPhone" class="form-label">手机号码</label>
                        <input 
                            type="tel" 
                            id="resetPhone" 
                            name="resetPhone" 
                            class="form-input"
                            placeholder="请输入注册手机号"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phoneCode" class="form-label">验证码</label>
                        <div class="flex space-x-3">
                            <input 
                                type="text" 
                                id="phoneCode" 
                                name="phoneCode" 
                                class="form-input flex-1"
                                placeholder="请输入验证码"
                                required
                            >
                            <button 
                                type="button" 
                                id="sendPhoneCodeBtn"
                                class="btn btn-secondary whitespace-nowrap"
                                onclick="sendPhoneCode()"
                            >
                                发送验证码
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-between">
                        <button type="button" class="btn btn-secondary" onclick="prevStep()">
                            <i class="fas fa-arrow-left mr-2"></i>
                            上一步
                        </button>
                        <button type="submit" class="btn btn-primary">
                            验证并重置
                            <i class="fas fa-check ml-2"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 第二步：安全问题 -->
            <div class="step" id="step2-security">
                <form id="securityResetForm" class="space-y-6">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-shield-alt text-purple-600 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900">安全验证</h3>
                        <p class="text-gray-600">请回答您的安全问题</p>
                    </div>

                    <div class="form-group">
                        <label for="username" class="form-label">用户名</label>
                        <input 
                            type="text" 
                            id="securityUsername" 
                            name="username" 
                            class="form-input"
                            placeholder="请输入用户名"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">您的第一只宠物叫什么名字？</label>
                        <input 
                            type="text" 
                            name="answer1" 
                            class="form-input"
                            placeholder="请输入答案"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">您的出生城市是？</label>
                        <input 
                            type="text" 
                            name="answer2" 
                            class="form-input"
                            placeholder="请输入答案"
                            required
                        >
                    </div>

                    <div class="flex justify-between">
                        <button type="button" class="btn btn-secondary" onclick="prevStep()">
                            <i class="fas fa-arrow-left mr-2"></i>
                            上一步
                        </button>
                        <button type="submit" class="btn btn-primary">
                            验证并重置
                            <i class="fas fa-check ml-2"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 第三步：成功页面 -->
            <div class="step" id="step3">
                <div class="text-center">
                    <div class="success-icon inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6">
                        <i class="fas fa-check text-green-600 text-3xl"></i>
                    </div>
                    
                    <h3 class="text-xl font-semibold text-gray-900 mb-4">重置成功！</h3>
                    <p class="text-gray-600 mb-6">您的密码已成功重置</p>
                    
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                        <div class="text-sm text-green-700">
                            <p class="font-medium mb-1">温馨提示：</p>
                            <p>为了您的账户安全，建议您定期更换密码，并使用强密码。</p>
                        </div>
                    </div>

                    <button type="button" class="btn btn-primary px-8" onclick="goToLogin()">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        立即登录
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/js/main.js"></script>
    <script>
        let selectedMethod = '';
        let phoneCountdown = 0;

        // 选择找回方式
        function selectMethod(method) {
            selectedMethod = method;
            
            // 更新选中状态
            document.querySelectorAll('.reset-method').forEach(el => {
                el.classList.remove('selected');
            });
            
            event.currentTarget.classList.add('selected');
            
            // 启用下一步按钮
            document.getElementById('nextBtn').disabled = false;
        }

        // 下一步
        function nextStep() {
            if (!selectedMethod) {
                Message.error('请选择找回密码的方式');
                return;
            }
            
            // 隐藏第一步
            document.getElementById('step1').classList.remove('active');
            
            // 显示对应的第二步
            document.getElementById(`step2-${selectedMethod}`).classList.add('active');
        }

        // 上一步
        function prevStep() {
            // 隐藏所有第二步
            document.querySelectorAll('[id^="step2-"]').forEach(el => {
                el.classList.remove('active');
            });
            
            // 显示第一步
            document.getElementById('step1').classList.add('active');
        }

        // 发送手机验证码
        function sendPhoneCode() {
            const phone = document.getElementById('resetPhone').value;
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                Message.error('请先输入有效的手机号码');
                return;
            }
            
            const sendBtn = document.getElementById('sendPhoneCodeBtn');
            phoneCountdown = 60;
            
            const updateCountdown = () => {
                if (phoneCountdown > 0) {
                    sendBtn.textContent = `${phoneCountdown}秒后重发`;
                    sendBtn.disabled = true;
                    phoneCountdown--;
                    setTimeout(updateCountdown, 1000);
                } else {
                    sendBtn.textContent = '发送验证码';
                    sendBtn.disabled = false;
                }
            };
            
            updateCountdown();
            Message.success('验证码已发送，请查收短信');
        }

        // 跳转到登录页面
        function goToLogin() {
            window.location.href = 'login.html';
        }

        // 显示成功页面
        function showSuccess() {
            // 隐藏所有步骤
            document.querySelectorAll('.step').forEach(el => {
                el.classList.remove('active');
            });
            
            // 显示成功页面
            document.getElementById('step3').classList.add('active');
        }

        // 表单提交处理
        document.getElementById('emailResetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value;
            
            if (!email || !/\S+@\S+\.\S+/.test(email)) {
                Message.error('请输入有效的邮箱地址');
                return;
            }
            
            // 模拟发送邮件
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>发送中...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                Message.success('重置链接已发送到您的邮箱');
                showSuccess();
            }, 2000);
        });

        document.getElementById('phoneResetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('resetPhone').value;
            const code = document.getElementById('phoneCode').value;
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                Message.error('请输入有效的手机号码');
                return;
            }
            
            if (!code || code.length !== 6) {
                Message.error('请输入6位验证码');
                return;
            }
            
            // 模拟验证
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>验证中...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                Message.success('验证成功，密码已重置');
                showSuccess();
            }, 2000);
        });

        document.getElementById('securityResetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('securityUsername').value;
            const answer1 = e.target.answer1.value;
            const answer2 = e.target.answer2.value;
            
            if (!username || !answer1 || !answer2) {
                Message.error('请填写完整信息');
                return;
            }
            
            // 模拟验证
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>验证中...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                Message.success('验证成功，密码已重置');
                showSuccess();
            }, 2000);
        });

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.querySelector('.forgot-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
