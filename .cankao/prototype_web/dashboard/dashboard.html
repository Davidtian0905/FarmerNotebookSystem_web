<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表板 - 茶农手账系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../shared/css/custom.css">
    <style>
        .gradient-card {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        }
        
        .stat-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .quick-action {
            transition: all 0.2s ease;
        }
        
        .quick-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -3px rgba(0, 0, 0, 0.1);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .weather-widget {
            background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
        }
        
        .notification-item {
            transition: background-color 0.2s ease;
        }
        
        .notification-item:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <header class="layout-header">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center">
                <div class="flex items-center mr-8">
                    <div class="w-8 h-8 bg-gradient-to-br from-green-400 to-green-600 rounded-lg flex items-center justify-center mr-3">
                        <i class="fas fa-leaf text-white text-sm"></i>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900">茶农手账</h1>
                </div>
            
            <!-- 侧边栏切换按钮 -->
            <button class="btn-icon mr-4" onclick="Sidebar.toggle()">
                <i class="fas fa-bars"></i>
            </button>
            
            <!-- 面包屑导航 -->
            <nav class="flex items-center text-sm text-gray-600">
                <a href="#" class="hover:text-gray-900">首页</a>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <span class="text-gray-900">仪表板</span>
            </nav>
        </div>
        
        <div class="flex items-center space-x-4">
            <!-- 搜索框 -->
            <div class="relative">
                <input 
                    type="text" 
                    placeholder="搜索..." 
                    class="w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                >
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            </div>
            
            <!-- 通知 -->
            <div class="relative">
                <button class="btn-icon relative">
                    <i class="fas fa-bell"></i>
                    <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">3</span>
                </button>
            </div>
            
            <div class="relative">
                <button class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100" onclick="toggleUserMenu()">
                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-4.0.3&auto=format&fit=crop&w=32&h=32&q=80" 
                         alt="用户头像" class="w-8 h-8 rounded-full">
                    <span class="text-sm font-medium text-gray-700">张茶农</span>
                    <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                </button>
                
                <div id="userMenu" class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 hidden z-50">
                    <a href="../profile/settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                        <i class="fas fa-cog mr-2"></i>设置
                    </a>
                    <hr class="my-2">
                    <a href="../auth/login.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                        <i class="fas fa-sign-out-alt mr-2"></i>退出登录
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- 左侧边栏 -->
    <aside class="layout-sidebar">
        <nav class="p-4">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link active">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <span>仪表板</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../assets/assets-overview.html" class="nav-link">
                        <i class="nav-icon fas fa-coins"></i>
                        <span>资产总览</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../records/flow-records.html" class="nav-link">
                        <i class="nav-icon fas fa-stream"></i>
                        <span>流水记录</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../warehouse/inbound-records.html" class="nav-link">
                        <i class="nav-icon fas fa-coins"></i>
                        <span>入库出库</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../inventory/inventory-list.html" class="nav-link">
                        <i class="nav-icon fas fa-boxes"></i>
                        <span>库存管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../customers/customer-list.html" class="nav-link">
                        <i class="nav-icon fas fa-users"></i>
                        <span>客户管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../suppliers/supplier-list.html" class="nav-link">
                        <i class="nav-icon fas fa-truck"></i>
                        <span>供应商管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../data/import-data.html" class="nav-link">
                        <i class="nav-icon fas fa-truck"></i>
                        <span>数据管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../vip/vip-upgrade.html" class="nav-link">
                        <i class="nav-icon fas fa-truck"></i>
                        <span>VIP功能</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../profile/profile.html" class="nav-link">
                        <i class="nav-icon fas fa-user"></i>
                        <span>个人中心</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="layout-main">
        <!-- 页面标题 -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-semibold text-gray-900">仪表板</h2>
                <p class="text-gray-600 mt-1">欢迎回来，张茶农！今天是个好日子</p>
            </div>
            <div class="flex items-center space-x-3">  
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="stat-card card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">今日收入</p>
                        <p class="text-2xl font-bold text-gray-900">¥2,580</p>
                        <div class="stat-trend positive mt-2">
                            <i class="fas fa-arrow-up"></i>
                            <span>+12.5%</span>
                        </div>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-arrow-up text-green-600"></i>
                    </div>
                </div>
            </div>

            <div class="stat-card card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">今日支出</p>
                        <p class="text-2xl font-bold text-gray-900">¥1,240</p>
                        <div class="stat-trend negative mt-2">
                            <i class="fas fa-arrow-down"></i>
                            <span>-3.2%</span>
                        </div>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-arrow-down text-red-600"></i>
                    </div>
                </div>
            </div>

            <div class="stat-card card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">库存总值</p>
                        <p class="text-2xl font-bold text-gray-900">¥45,680</p>
                        <div class="stat-trend positive mt-2">
                            <i class="fas fa-arrow-up"></i>
                            <span>+5.8%</span>
                        </div>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-boxes text-blue-600"></i>
                    </div>
                </div>
            </div>

            <div class="stat-card card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">活跃客户</p>
                        <p class="text-2xl font-bold text-gray-900">156</p>
                        <div class="stat-trend positive mt-2">
                            <i class="fas fa-arrow-up"></i>
                            <span>+8.1%</span>
                        </div>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-users text-purple-600"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表和快捷操作 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- 收支趋势图表 -->
            <div class="lg:col-span-2 card">
                <div class="card-header">
                    <h3 class="card-title">收支趋势</h3>
                    <div class="flex space-x-2">
                        <button class="text-sm px-3 py-1 bg-green-100 text-green-700 rounded-full">本周</button>
                        <button class="text-sm px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-full">本月</button>
                        <button class="text-sm px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-full">本年</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- 快捷操作 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">快捷操作</h3>
                </div>
                <div class="space-y-3">
                    <a href="../records/inbound-form.html" class="quick-action block p-4 bg-green-50 rounded-lg border border-green-200">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mr-3">
                                <i class="fas fa-plus text-green-600"></i>
                            </div>
                            <div>
                                <h4 class="font-medium text-gray-900">入库记录</h4>
                                <p class="text-sm text-gray-600">添加新的入库记录</p>
                            </div>
                        </div>
                    </a>

                    <a href="../records/sales-form.html" class="quick-action block p-4 bg-blue-50 rounded-lg border border-blue-200">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                                <i class="fas fa-shopping-cart text-blue-600"></i>
                            </div>
                            <div>
                                <h4 class="font-medium text-gray-900">销售记录</h4>
                                <p class="text-sm text-gray-600">记录销售交易</p>
                            </div>
                        </div>
                    </a>

                    <a href="../records/voice-recording.html" class="quick-action block p-4 bg-purple-50 rounded-lg border border-purple-200">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center mr-3">
                                <i class="fas fa-microphone text-purple-600"></i>
                            </div>
                            <div>
                                <h4 class="font-medium text-gray-900">语音记账</h4>
                                <p class="text-sm text-gray-600">AI智能语音记录</p>
                            </div>
                        </div>
                    </a>

                    <a href="../inventory/inventory-check.html" class="quick-action block p-4 bg-orange-50 rounded-lg border border-orange-200">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center mr-3">
                                <i class="fas fa-clipboard-check text-orange-600"></i>
                            </div>
                            <div>
                                <h4 class="font-medium text-gray-900">库存盘点</h4>
                                <p class="text-sm text-gray-600">检查库存状态</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>



    <script src="../shared/js/main.js"></script>
    <script src="../shared/js/components.js"></script>
    <script>
        // 切换用户菜单
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }

        // 点击外部关闭菜单
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('userMenu');
            const button = e.target.closest('button');
            
            if (!button || !button.onclick || button.onclick.toString().indexOf('toggleUserMenu') === -1) {
                menu.classList.add('hidden');
            }
        });

        // 切换导航组
        function toggleNavGroup(element) {
            const submenu = element.nextElementSibling;
            const icon = element.querySelector('.fa-chevron-down');

            if (submenu.style.display === 'block') {
                submenu.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                submenu.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';
            }
        }        

        // 初始化图表
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: '收入',
                        data: [2800, 3200, 2900, 3500, 3100, 2600, 2580],
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4,
                        fill: true
                    }, {
                        label: '支出',
                        data: [1200, 1400, 1100, 1600, 1300, 1000, 1240],
                        borderColor: '#EF4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
