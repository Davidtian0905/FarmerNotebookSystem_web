    <!-- 主内容区 -->
    <main class="layout-main">
        <!-- 页面标题和操作 -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-semibold text-gray-900">销售记录</h2>
                <p class="text-gray-600 mt-1">添加新的茶叶销售记录</p>
            </div>
            <div class="flex items-center space-x-3">
                <a href="../warehouse/outbound-records.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left mr-2"></i>
                    返回列表

                    <i class="fas fa-cogs mr-2"></i>
                    物料组合

            <!-- 商品信息 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">商品信息</h3>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="form-group">
                            <label for="productName" class="form-label">出售商品名称 *</label>
                            <div class="relative">
                                <select id="productName" name="productName" class="form-input" required onchange="updateProductInfo()">
                                    <option value="">请选择商品</option>
                                    <option value="精品红茶礼盒">精品红茶礼盒</option>
                                    <option value="有机绿茶散装">有机绿茶散装</option>
                                    <option value="白茶特级礼盒">白茶特级礼盒</option>
                                    <option value="茶具套装">茶具套装</option>
                                    <option value="混合茶叶礼盒">混合茶叶礼盒</option>
                                </select>
                                <button type="button" class="absolute right-10 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-blue-500" onclick="window.location.href='product-composition.html'">
                                    <i class="fas fa-plus" title="创建新商品"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="productQuantity" class="form-label">销售数量</label>
                            <div class="flex items-center space-x-2">
                                <input type="number" id="productQuantity" name="productQuantity" 
                                       class="form-input" placeholder="1" min="1" value="1" 
                                       oninput="updateTotalAmount()">
                                <span class="text-sm text-gray-500" id="productUnit">件</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 客户信息 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">客户信息</h3>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="form-group">
                            <label for="customerSelect" class="form-label">选择客户</label>
                            <select id="customerSelect" name="customerSelect" class="form-input" onchange="updateCustomerInfo()">
                                <option value="">请选择客户</option>
                                <option value="customer1">张三 - 138****1234</option>
                                <option value="customer2">李四 - 139****5678</option>
                                <option value="customer3">王五 - 137****9012</option>
                                <option value="new">+ 添加新客户</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="customerDiscount" class="form-label">客户折扣率</label>
                            <div class="relative">
                                <input type="number" id="customerDiscount" name="customerDiscount" 
                                       class="form-input pr-8" placeholder="100" min="0" max="100" value="100"
                                       oninput="updateTotalAmount()">
                                <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 客户详细信息 -->
                    <div id="customerDetails" class="mt-4 p-4 bg-gray-50 rounded-lg hidden">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="text-sm text-gray-600">联系人</label>
                                <p class="font-medium" id="customerName">-</p>
                            </div>
                            <div>
                                <label class="text-sm text-gray-600">联系电话</label>
                                <p class="font-medium" id="customerPhone">-</p>
                            </div>
                            <div>
                                <label class="text-sm text-gray-600">地址</label>
                                <p class="font-medium" id="customerAddress">-</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 价格信息 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">价格信息</h3>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="form-group">
                            <label for="unitPrice" class="form-label">商品单价</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">¥</span>
                                <input type="number" id="unitPrice" name="unitPrice" 
                                       class="form-input pl-8" placeholder="0.00" step="0.01"
                                       oninput="updateTotalAmount()">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="discountAmount" class="form-label">折扣金额</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">¥</span>
                                <input type="number" id="discountAmount" name="discountAmount" 
                                       class="form-input pl-8 bg-gray-50" placeholder="0.00" step="0.01" readonly>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="finalPrice" class="form-label">最终销售价格</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">¥</span>
                                <input type="number" id="finalPrice" name="finalPrice" 
                                       class="form-input pl-8 font-bold text-green-600" placeholder="0.00" step="0.01"
                                       oninput="updateDiscountFromFinal()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 其他信息 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">其他信息</h3>
                </div>
                <div class="p-6 space-y-4">
                    <div class="form-group">
                        <label for="salesChannel" class="form-label">销售渠道</label>
                        <select id="salesChannel" name="salesChannel" class="form-input">
                            <option value="线下门店">线下门店</option>
                            <option value="微信小程序">微信小程序</option>
                            <option value="淘宝店铺">淘宝店铺</option>
                            <option value="拼多多">拼多多</option>
                            <option value="抖音直播">抖音直播</option>
                            <option value="朋友圈">朋友圈</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes" class="form-label">备注说明</label>
                        <textarea id="notes" name="notes" class="form-input h-24 resize-none" placeholder="请输入备注信息..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">订单标签</label>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm hover:bg-red-200 transition-colors" onclick="toggleTag(this)">紧急订单</button>
                            <button type="button" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm hover:bg-yellow-200 transition-colors" onclick="toggleTag(this)">VIP客户</button>
                            <button type="button" class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm hover:bg-green-200 transition-colors" onclick="toggleTag(this)">老客户</button>
                            <button type="button" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm hover:bg-blue-200 transition-colors" onclick="toggleTag(this)">批发订单</button>
                            <button type="button" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm hover:bg-purple-200 transition-colors" onclick="toggleTag(this)">预定订单</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 提交按钮 -->
            <div class="flex justify-end space-x-4">
                <button type="button" class="btn btn-secondary" onclick="saveAsDraft()">
                    <i class="fas fa-save mr-2"></i>
                    保存草稿
                </button>
                <button type="submit" class="btn btn-primary" onclick="submitSales(event)">
                    <i class="fas fa-check mr-2"></i>
                    确认销售
                </button>
            </div>
        </form>
    </main>

    <script src="../shared/js/components.js"></script>
    <script src="../shared/js/main.js"></script>
    <script>
        // 商品信息数据（模拟）
        const productData = {
            '精品红茶礼盒': { price: 168.00, unit: '盒' },
            '有机绿茶散装': { price: 88.00, unit: '斤' },
            '白茶特级礼盒': { price: 298.00, unit: '盒' },
            '茶具套装': { price: 158.00, unit: '套' },
            '混合茶叶礼盒': { price: 218.00, unit: '盒' }
        };

        // 客户信息数据（模拟）
        const customerData = {
            'customer1': { name: '张三', phone: '138****1234', address: '北京市朝阳区', discount: 95 },
            'customer2': { name: '李四', phone: '139****5678', address: '上海市浦东新区', discount: 90 },
            'customer3': { name: '王五', phone: '137****9012', address: '广州市天河区', discount: 100 }
        };

        function selectProductTemplate() {
            alert('选择商品模板功能待实现，可跳转到物料组合页面创建');
            window.location.href = 'product-composition.html';
        }

        function updateProductInfo() {
            const productSelect = document.getElementById('productName');
            const selectedProduct = productSelect.value;
            
            if (selectedProduct && productData[selectedProduct]) {
                const product = productData[selectedProduct];
                document.getElementById('unitPrice').value = product.price.toFixed(2);
                document.getElementById('productUnit').textContent = product.unit;
                updateTotalAmount();
            } else {
                document.getElementById('unitPrice').value = '';
                document.getElementById('productUnit').textContent = '件';
            }
        }

        function updateCustomerInfo() {
            const customerSelect = document.getElementById('customerSelect');
            const selectedCustomer = customerSelect.value;
            const customerDetails = document.getElementById('customerDetails');
            
            if (selectedCustomer === 'new') {
                // 跳转到添加客户页面
                window.location.href = '../customers/add-customer.html';
                return;
            }
            
            if (selectedCustomer && customerData[selectedCustomer]) {
                const customer = customerData[selectedCustomer];
                document.getElementById('customerName').textContent = customer.name;
                document.getElementById('customerPhone').textContent = customer.phone;
                document.getElementById('customerAddress').textContent = customer.address;
                document.getElementById('customerDiscount').value = customer.discount;
                customerDetails.classList.remove('hidden');
                updateTotalAmount();
            } else {
                customerDetails.classList.add('hidden');
                document.getElementById('customerDiscount').value = '100';
            }
        }

        function updateTotalAmount() {
            const quantity = parseFloat(document.getElementById('productQuantity').value) || 1;
            const unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
            const discountRate = parseFloat(document.getElementById('customerDiscount').value) || 100;
            
            const subtotal = quantity * unitPrice;
            const discountAmount = subtotal * (1 - discountRate / 100);
            const finalPrice = subtotal - discountAmount;
            
            document.getElementById('discountAmount').value = discountAmount.toFixed(2);
            document.getElementById('finalPrice').value = finalPrice.toFixed(2);
        }

        function updateDiscountFromFinal() {
            const quantity = parseFloat(document.getElementById('productQuantity').value) || 1;
            const unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
            const finalPrice = parseFloat(document.getElementById('finalPrice').value) || 0;
            
            const subtotal = quantity * unitPrice;
            const discountAmount = subtotal - finalPrice;
            const discountRate = subtotal > 0 ? ((subtotal - finalPrice) / subtotal * 100) : 100;
            
            document.getElementById('discountAmount').value = Math.max(0, discountAmount).toFixed(2);
            document.getElementById('customerDiscount').value = Math.max(0, Math.min(100, 100 - discountRate)).toFixed(1);
        }

        function toggleTag(button) {
            button.classList.toggle('opacity-50');
            button.classList.toggle('line-through');
        }

        function saveAsDraft() {
            alert('保存草稿功能待实现');
        }

        function submitSales(event) {
            event.preventDefault();
            
            const productName = document.getElementById('productName').value;
            const finalPrice = document.getElementById('finalPrice').value;
            
            if (!productName) {
                alert('请选择商品');
                return;
            }
            
            if (!finalPrice || parseFloat(finalPrice) <= 0) {
                alert('请输入有效的销售价格');
                return;
            }
            
            // 收集表单数据
            const formData = {
                productName: productName,
                quantity: document.getElementById('productQuantity').value,
                unitPrice: document.getElementById('unitPrice').value,
                customerSelect: document.getElementById('customerSelect').value,
                customerDiscount: document.getElementById('customerDiscount').value,
                discountAmount: document.getElementById('discountAmount').value,
                finalPrice: finalPrice,
                salesChannel: document.getElementById('salesChannel').value,
                notes: document.getElementById('notes').value,
                tags: Array.from(document.querySelectorAll('.opacity-50')).map(tag => tag.textContent)
            };
            
            console.log('销售数据:', formData);
            alert('销售记录提交成功！');
            
            // 可以跳转到记录列表页面
            // window.location.href = '../warehouse/outbound-records.html';
        }

        // 切换导航组
        function toggleNavGroup(element) {
            const submenu = element.nextElementSibling;
            const icon = element.querySelector('.fa-chevron-down');

            if (submenu.style.display === 'block') {
                submenu.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                submenu.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化导航组状态
            const activeNavGroup = document.querySelector('.nav-group .nav-link.active');
            if (activeNavGroup) {
                const submenu = activeNavGroup.nextElementSibling;
                const icon = activeNavGroup.querySelector('.fa-chevron-down');
                submenu.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';
            }
        });
    </script>
</body>
</html>
